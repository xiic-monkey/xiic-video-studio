[package]
name = "frameforge"
version = "0.1.0"
description = "Local-first AI short drama studio"
authors = ["Frameforge"]
edition = "2021"

[lib]
name = "frameforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
# 拆帧 / 缩略图：只开用得到的格式，控制构建体积。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
hmac = "0.12"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
# 系统剪贴板读图：macOS 的 WKWebView 不会把剪贴板图片交给前端 paste 事件，
# 只能由后端直接读系统剪贴板（只开 read-image 权限）。
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }
quick-xml = "0.37"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6"

# ---- 开发构建体积优化 ----
# 依据 Cargo 官方指南 Optimizing Build Performance：
# 自身 crate 保留行号表，panic backtrace 仍可定位到 文件:行号
# 第三方依赖不生成任何调试信息（依赖通常占 target 体积的 80% 以上）
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 需要完整调试依赖内部时：cargo build --profile debugging
[profile.debugging]
inherits = "dev"
debug = true
